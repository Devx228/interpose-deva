name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development, benchmark, and LangGraph dependencies
        run: python -m pip install -e ".[dev,bench,langgraph]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy --strict src tests examples

      - name: Test
        run: pytest -q

      - name: Run offline security demo
        run: python examples/offline_demo/run.py

      - name: Run offline LangGraph security demo
        run: python examples/langgraph_security_demo.py
