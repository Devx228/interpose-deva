[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "capgate"
version = "0.1.0"
description = "Capability-secure runtime foundation for AI agent tool calls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100.0",
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]
bench = [
  "agentdojo==0.1.35",
]
langgraph = [
  "langchain-core==1.4.8",
  "langgraph==1.2.7",
  "langgraph-prebuilt==1.1.0",
]
# Local-model demos only. No provider ever sits in the enforcement path.
ollama = [
  "langchain-ollama==1.1.0",
]

[project.scripts]
capgate = "capgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/capgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

# The [ollama] extra is demo-only and deliberately not part of the dev or CI environment;
# no provider package ever sits in the enforcement path. Checking the demos must not
# require installing one.
[[tool.mypy.overrides]]
module = ["langchain_ollama", "langchain_ollama.*"]
ignore_missing_imports = true
